# nginx config for the Excalidraw Docker image.
#
# Designed to run as an unprivileged user with a read-only root filesystem
# and all Linux capabilities dropped, e.g.:
#
#   docker run --read-only --tmpfs /tmp --cap-drop=ALL \
#     --security-opt no-new-privileges -p 5000:8080 excalidraw/excalidraw
#
# - no `user` directive: nginx runs as whatever user the container runs as
# - listens on unprivileged port 8080 (no CAP_NET_BIND_SERVICE needed)
# - the only writable path needed is /tmp (pid file + temp dirs)
# - logs go to stdout/stderr instead of /var/log/nginx

worker_processes auto;

error_log /dev/stderr notice;
pid       /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /dev/stdout main;

    sendfile          on;
    keepalive_timeout 65;

    server {
        listen      8080;
        server_name localhost;

        location / {
            root  /usr/share/nginx/html;
            index index.html index.htm;
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
