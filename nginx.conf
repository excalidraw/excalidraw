# nginx config for the excalidraw Docker image.
#
# Designed to run as an unprivileged user (any UID) with a read-only root
# filesystem and all Linux capabilities dropped:
#
#   docker run --read-only --tmpfs /tmp --cap-drop=ALL \
#     --security-opt no-new-privileges --user 1010:1010 -p 5000:8080 excalidraw
#
# - listens on an unprivileged port (8080), so CAP_NET_BIND_SERVICE isn't needed
# - no `user` directive (only meaningful when the master runs as root)
# - the pid file and all temp paths live in /tmp (the only writable path)
# - logs go to stdout/stderr instead of /var/log/nginx

worker_processes auto;

error_log stderr notice;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /dev/stdout main;

    sendfile on;
    keepalive_timeout 65;

    server {
        listen 8080;
        server_name localhost;

        location / {
            root /usr/share/nginx/html;
            index index.html index.htm;
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
