packages:
  - excalidraw-app
  - packages/*
  - examples/*

overrides:
  strip-ansi: 6.0.1

# dependencies allowed to run install scripts (pnpm 10 blocks them by default)
onlyBuiltDependencies:
  - "@parcel/watcher"
  - core-js
  - esbuild
  - protobufjs

# Type- and test-only edges close a cycle (element imports editor types from
# excalidraw, and its tests use excalidraw's test harness). Runtime deps are
# acyclic.
ignoreWorkspaceCycles: true
