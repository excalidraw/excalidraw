packages:
  - excalidraw-app
  - packages/*
  - examples/*

overrides:
  strip-ansi: 6.0.1

# dependencies allowed to run install scripts (pnpm 10 blocks them by default)
onlyBuiltDependencies:
  - "@parcel/watcher"
  - core-js
  - esbuild
  - protobufjs

# Type- and test-only edges close cycles (common/element import shared types
# from excalidraw; element tests use its test harness). Runtime deps are acyclic.
ignoreWorkspaceCycles: true
