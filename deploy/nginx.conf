# Serves the built web app and proxies the API, realtime socket, public API and MCP to `server:3100`.
# Terminate TLS in front of this (or add a `listen 443 ssl` block); cookies are Secure in production.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

upstream workspace_api {
  server server:3100;
  keepalive 16;
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 16m;   # scenes up to 10 MB + JSON overhead
  server_tokens off;

  # ---- security headers (re-declared in every location that adds its own) ----
  # Verified against the production build in Chrome: editor, Mermaid dialog and PDF export run with
  # zero violations. Expect console notices for the editor's built-in *fallback* font URLs
  # (esm.sh): the browser only reports them, it never fetches them because our own /assets fonts
  # load first. Keep `font-src 'self' data:` strict rather than allowing that CDN.
  set $csp "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'";

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "same-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Content-Security-Policy "${csp}; frame-ancestors 'self'" always;

  # ---- API, realtime (WebSocket), public API, MCP ----
  location /api/ {
    proxy_pass http://workspace_api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;    # long-lived collaboration sockets
    proxy_buffering off;         # AI streaming (SSE)
  }

  location /public/ {
    proxy_pass http://workspace_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /mcp {
    proxy_pass http://workspace_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /health {
    proxy_pass http://workspace_api;
    access_log off;
  }

  # ---- embeds: the read-only /embed/<token> view may be framed by other sites ----
  location /embed/ {
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Content-Security-Policy "${csp}; frame-ancestors *" always;
    try_files /index.html =404;
  }

  # ---- static assets: hashed filenames are immutable ----
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # ---- single-page app ----
  location / {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "${csp}; frame-ancestors 'self'" always;
    try_files $uri /index.html;
  }
}
