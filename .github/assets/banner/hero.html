<!DOCTYPE html>
<meta charset="utf-8" />
<title>Excalidraw banner</title>
<style>
  @font-face {
    font-family: "Geist";
    src: url("geist-latin-wght-normal.woff2") format("woff2");
    font-weight: 100 900;
  }
  @font-face {
    font-family: "Geist Mono";
    src: url("geist-mono-latin-wght-normal.woff2") format("woff2");
    font-weight: 100 900;
  }
  /* the Latin subset of the editor's own hand-drawn font */
  @font-face {
    font-family: "Excalifont";
    src: url("../../../packages/excalidraw/fonts/Excalifont/Excalifont-Regular-a88b72a24fb54c9f94e3b5fdaa7481c9.woff2")
      format("woff2");
  }

  :root {
    --bg: #fbfbfd;
    --dots: #dcdce6;
    --fg: #17171c;
    --muted: #6b6b7b;
    --card: #ffffff;
    --border: #e6e6ee;
    --primary: #6965db;
    --primary-soft: #ecebfd;
    --glow: rgba(105, 101, 219, 0.26);
    --glow-2: rgba(32, 201, 151, 0.1);
    --shadow: 0 1px 2px rgba(20, 20, 40, 0.06),
      0 18px 48px -12px rgba(40, 36, 120, 0.28);
  }
  .dark {
    --bg: #0e0e12;
    --dots: #24242c;
    --fg: #f4f4f7;
    --muted: #a1a1b0;
    --card: #18181d;
    --border: rgba(255, 255, 255, 0.09);
    --primary: #9b97f5;
    --primary-soft: rgba(155, 151, 245, 0.14);
    --glow: rgba(105, 101, 219, 0.38);
    --glow-2: rgba(32, 201, 151, 0.12);
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.5), 0 24px 60px -12px rgba(0, 0, 0, 0.7);
  }

  * {
    box-sizing: border-box;
  }
  html,
  body {
    margin: 0;
  }
  body {
    font-family: "Geist", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .hero {
    position: relative;
    width: 1280px;
    height: 600px;
    overflow: hidden;
    border-radius: 18px;
    color: var(--fg);
    background: radial-gradient(
        560px 460px at 76% 52%,
        var(--glow),
        transparent 72%
      ),
      radial-gradient(480px 320px at 4% 100%, var(--glow-2), transparent 70%),
      radial-gradient(circle, var(--dots) 1.2px, transparent 1.4px) 0 0 / 22px
        22px,
      var(--bg);
  }

  .left {
    position: absolute;
    left: 72px;
    top: 0;
    bottom: 0;
    width: 470px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .logo {
    width: 54px;
    height: 54px;
    flex: none;
    margin-right: 16px;
    transform: translateY(2px);
  }
  h1 {
    margin: 0;
    font-size: 58px;
    line-height: 1;
    font-weight: 650;
    letter-spacing: -0.04em;
    white-space: nowrap;
  }
  h1 .row {
    display: flex;
    align-items: center;
  }
  h1 .row + .row {
    margin-top: 14px;
  }
  .hand {
    position: relative;
    display: inline-block;
    font-family: "Excalifont";
    font-weight: 400;
    color: var(--primary);
    letter-spacing: 0;
    /* sized so the word is as wide as the row above it, logo included */
    font-size: 66px;
  }
  .hand svg {
    position: absolute;
    left: -6px;
    bottom: -14px;
    width: calc(100% + 6px);
    height: 18px;
    overflow: visible;
  }
  .points {
    margin: 38px 0 0;
    padding: 0;
    list-style: none;
    font-size: 21px;
    line-height: 1;
    color: var(--muted);
    letter-spacing: -0.01em;
  }
  .points li {
    display: flex;
    align-items: center;
  }
  .points li + li {
    margin-top: 12px;
  }
  .points svg {
    flex: none;
    width: 32px;
    height: 32px;
    margin-right: 14px;
    padding: 6px;
    border-radius: 9px;
    color: var(--primary);
    background: var(--primary-soft);
    fill: none;
    stroke: currentColor;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .editor {
    position: absolute;
    right: 34px;
    top: 75px;
    width: 706px;
    padding: 10px;
    border-radius: 16px;
    background: var(--card);
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    transform: rotate(1.6deg);
  }
  .editor img {
    display: block;
    width: 100%;
    border-radius: 8px;
  }

  .term {
    /* as wide as the title above it */
    width: 353px;
    margin-top: 30px;
    border-radius: 14px;
    overflow: hidden;
    background: #15151b;
    border: 1px solid rgba(255, 255, 255, 0.08);
    box-shadow: 0 22px 50px -18px rgba(10, 8, 40, 0.55);
    font-family: "Geist Mono", monospace;
    font-size: 13px;
    line-height: 1.6;
    color: #e6e6ef;
  }
  .bar {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 13px;
    background: #1c1c24;
    border-bottom: 1px solid rgba(255, 255, 255, 0.06);
  }
  .bar i {
    width: 10px;
    height: 10px;
    border-radius: 50%;
  }
  .bar span {
    margin-left: 9px;
    font-size: 11.5px;
    color: #8b8b9c;
    font-family: "Geist", sans-serif;
  }
  pre {
    margin: 0;
    padding: 11px 16px 13px;
    font: inherit;
    white-space: pre;
  }
  .pr {
    color: #9b97f5;
  }
  .s {
    color: #a6e3a1;
  }
</style>

<script>
  const rawTheme = new URLSearchParams(location.search).get("theme");
  const theme =
    rawTheme === "dark" || rawTheme === "light" ? rawTheme : "light";
  document.documentElement.classList.toggle("dark", theme === "dark");
  document.getElementById("editor").src = `editor-${theme}.png`;
</script>
