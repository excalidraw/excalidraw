    <style>
      :root {
        --background: #ffffff;
        --text: #1b1b1f;
        --text-muted: #6b6b76;
        --primary: #6965db;
        --primary-hover: #5b57d1;
        --on-primary: #ffffff;
        --glow: rgba(105, 101, 219, 0.14);
        --grid: rgba(27, 27, 31, 0.07);
        --cursor: #f76707;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --background: #121212;
          --text: #e3e3e8;
          --text-muted: #a0a0ab;
          --primary: #a8a5ff;
          --primary-hover: #b2aeff;
          --on-primary: #121212;
          --glow: rgba(168, 165, 255, 0.13);
          --grid: rgba(227, 227, 232, 0.06);
          --cursor: #ffa94d;
        }
      }

      body {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        padding: 1.5rem;
        box-sizing: border-box;
        /* the cursor label may stick out sideways; vertical overflow scrolls */
        overflow-x: hidden;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        background: var(--background);
        color: var(--text);
      }

      /* canvas grid, fading out towards the edges */
      body::before {
        content: "";
        position: absolute;
        inset: 0;
        background-image: radial-gradient(
            circle at 50% 42%,
            var(--glow),
            transparent 34rem
          ),
          linear-gradient(var(--grid) 1px, transparent 1px),
          linear-gradient(90deg, var(--grid) 1px, transparent 1px);
        background-size: auto, 24px 24px, 24px 24px;
        background-position: center;
        -webkit-mask-image: radial-gradient(
          ellipse at 50% 45%,
          #000 20%,
          transparent 72%
        );
        mask-image: radial-gradient(
          ellipse at 50% 45%,
          #000 20%,
          transparent 72%
        );
      }

      main {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
        /* shrink on short (landscape) screens so that everything fits */
        max-width: clamp(15rem, calc((100vh - 16rem) * 1.6), 30rem);
        text-align: center;
      }

      svg {
        display: block;
        overflow: visible;
      }

      .art {
        width: 100%;
        height: auto;
      }

      .digits {
        fill: var(--text);
      }

      .selection {
        fill: none;
        stroke: var(--primary);
        stroke-width: 1;
      }

      .handles {
        fill: var(--background);
        stroke: var(--primary);
        stroke-width: 1;
      }

      .cursor {
        animation: drift 5s ease-in-out infinite;
      }

      .cursor path {
        fill: var(--cursor);
        stroke: var(--background);
        stroke-width: 1.5;
        stroke-linejoin: round;
      }

      .cursor rect {
        fill: var(--cursor);
      }

      .cursor text {
        fill: #1b1b1f;
        font-size: 12px;
        font-weight: 600;
      }

      h1 {
        width: 82%;
        margin: 1.25rem 0 0;
      }

      h1 svg {
        width: 100%;
        height: auto;
        fill: var(--text);
      }

      .underline {
        fill: none;
        stroke: var(--primary);
        stroke-width: 4.5;
        stroke-linecap: round;
        stroke-dasharray: 1;
        stroke-dashoffset: 1;
        animation: draw 0.7s 0.5s ease-out forwards;
      }

      p {
        margin: 0.75rem 0 0;
        font-size: 1.0625rem;
        line-height: 1.5;
        color: var(--text-muted);
      }

      .button {
        margin-top: 1.75rem;
        padding: 0.75rem 1.5rem;
        border-radius: 0.625rem;
        font-weight: 600;
        text-decoration: none;
        background: var(--primary);
        color: var(--on-primary);
        transition: background-color 0.15s, transform 0.15s;
      }

      .button:hover {
        background: var(--primary-hover);
        transform: translateY(-1px);
      }

      a:focus-visible {
        outline: 2px solid var(--primary);
        outline-offset: 3px;
        border-radius: 0.25rem;
      }

      nav {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.5rem 0.75rem;
        margin-top: 1.5rem;
        font-size: 0.9375rem;
      }

      nav span {
        color: var(--text-muted);
        opacity: 0.6;
      }

      nav a {
        color: var(--text-muted);
        text-decoration: none;
        transition: color 0.15s;
      }

      nav a:hover {
        color: var(--primary);
        text-decoration: underline;
        text-underline-offset: 0.2em;
      }

      main > * {
        animation: rise 0.5s ease-out backwards;
      }

      main > :nth-child(2) {
        animation-delay: 0.08s;
      }

      main > :nth-child(3) {
        animation-delay: 0.16s;
      }

      main > :nth-child(4) {
        animation-delay: 0.24s;
      }

      main > :nth-child(5) {
        animation-delay: 0.32s;
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
      }

      @keyframes draw {
        to {
          stroke-dashoffset: 0;
        }
      }

      @keyframes drift {
        50% {
          transform: translate(7px, 5px);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before {
          animation: none !important;
          transition: none !important;
        }

        .underline {
          stroke-dashoffset: 0;
        }
      }
    </style>
